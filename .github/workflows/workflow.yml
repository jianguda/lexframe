name: workflow

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]  # tag pushes ignore the path filter
    paths: &code
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/**"
  pull_request:
    paths: *code
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            torch: "torch==2.10.0"
            pins: "numpy==2.4.1 transformers==5.0.0"
          - python: "3.14"
            torch: "torch"
            pins: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install ${{ matrix.pins }} ".[test]"
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lexframe
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
